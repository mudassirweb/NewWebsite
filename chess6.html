<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two Player Chess</title>
<style>
    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes piece-appear {
        from {
            transform: scale(0.8);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @keyframes glow {
        0%, 100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
        50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.4); }
    }

    body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        background-size: 200% 200%;
        animation: gradient-shift 15s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        user-select: none;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
    }

    #board-container {
        position: relative;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
    }

    #board {
        width: 640px;
        height: 640px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        border: 6px solid #2d4a3e;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 
            0 0 0 2px rgba(255, 255, 255, 0.1),
            0 10px 50px rgba(0, 0, 0, 0.6);
    }

    .square {
        width: 80px;
        height: 80px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 54px;
        cursor: pointer;
        font-weight: 500;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.3);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .square::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .square:hover::before {
        opacity: 1;
    }

    .square:hover {
        transform: scale(0.95);
    }

    .square span {
        transition: all 0.3s ease;
        display: inline-block;
    }

    .square:hover span {
        transform: translateY(-3px);
        filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
    }

    .light { 
        background: linear-gradient(135deg, #ffffdd 0%, #fffef0 100%);
    }
    
    .dark  { 
        background: linear-gradient(135deg, #86a666 0%, #779959 100%);
    }

    .selected { 
        outline: 4px solid #ff6b6b;
        outline-offset: -4px;
        z-index: 10;
        background: radial-gradient(circle at center, rgba(255, 107, 107, 0.3), transparent 70%);
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
    }

    .valid { 
        outline: 4px solid #ffd700;
        outline-offset: -4px;
        position: relative;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .valid::after {
        content: '●';
        position: absolute;
        font-size: 24px;
        color: rgba(255, 215, 0, 0.7);
        pointer-events: none;
    }

    .piece-animate {
        animation: piece-appear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #turn-indicator {
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 12px 30px;
        border-radius: 25px;
        color: white;
        font-size: 18px;
        font-weight: 600;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
    }

    #turn-indicator::before {
        content: '';
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-right: 10px;
        vertical-align: middle;
        box-shadow: 0 0 10px currentColor;
        transition: background-color 0.3s ease;
    }

    #turn-indicator.white::before {
        background-color: #fff;
    }

    #turn-indicator.black::before {
        background-color: #333;
    }
</style>
</head>
<body>

<div id="board-container">
    <div id="turn-indicator" class="white">White's Turn</div>
    <div id="board"></div>
</div>

<script>
// Unicode chess pieces
const PIECES = {
    white: { king:"♔", queen:"♕", rook:"♖", bishop:"♗", knight:"♘", pawn:"♙" },
    black: { king:"♚", queen:"♛", rook:"♜", bishop:"♝", knight:"♞", pawn:"♟︎" }
};

// Board state (8x8)
let board = [
    ["b_rook","b_knight","b_bishop","b_queen","b_king","b_bishop","b_knight","b_rook"],
    ["b_pawn","b_pawn","b_pawn","b_pawn","b_pawn","b_pawn","b_pawn","b_pawn"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["w_pawn","w_pawn","w_pawn","w_pawn","w_pawn","w_pawn","w_pawn","w_pawn"],
    ["w_rook","w_knight","w_bishop","w_queen","w_king","w_bishop","w_knight","w_rook"]
];

let boardDiv = document.getElementById("board");
let turnIndicator = document.getElementById("turn-indicator");
let selected = null;
let currentPlayer = "w"; // w = white, b = black
let validMoves = [];

renderBoard();
updateTurnIndicator();

// ------------------------
// Rendering
// ------------------------
function renderBoard() {
    boardDiv.innerHTML = "";

    for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
            let square = document.createElement("div");
            square.classList.add("square");

            // square color
            square.classList.add((r+c)%2 === 0 ? "light" : "dark");

            let piece = board[r][c];
            if (piece) {
                square.innerHTML = getPieceSymbol(piece);
            }

            square.dataset.row = r;
            square.dataset.col = c;

            // highlight selected
            if (selected && selected.r == r && selected.c == c) {
                square.classList.add("selected");
            }

            // highlight valid moves
            if (validMoves.some(m => m.r == r && m.c == c)) {
                square.classList.add("valid");
            }

            square.addEventListener("click", () => onSquareClick(r, c));

            boardDiv.appendChild(square);
        }
    }
}

// ------------------------
// Turn indicator
// ------------------------
function updateTurnIndicator() {
    turnIndicator.textContent = currentPlayer === "w" ? "White's Turn" : "Black's Turn";
    turnIndicator.className = currentPlayer === "w" ? "white" : "black";
}

// ------------------------
// Piece symbols
// ------------------------
function getPieceSymbol(code) {
    const [color, type] = code.split("_");
    const symbol = PIECES[color === "w" ? "white" : "black"][type];
    const style = color === "b" ? ' style="font-weight: 400;"' : '';
    return `<span${style}>${symbol}</span>`;
}

// ------------------------
// Handling clicks
// ------------------------
function onSquareClick(r, c) {
    let piece = board[r][c];

    // selecting a piece
    if (!selected) {
        if (!piece.startsWith(currentPlayer)) return;

        selected = { r, c };
        validMoves = getMovesForPiece(r, c);
        renderBoard();
        return;
    }

    // moving piece
    if (validMoves.some(m => m.r == r && m.c == c)) {
        board[r][c] = board[selected.r][selected.c];
        board[selected.r][selected.c] = "";

        // switch turn
        currentPlayer = currentPlayer === "w" ? "b" : "w";
        updateTurnIndicator();
    }

    selected = null;
    validMoves = [];
    renderBoard();
}

// ------------------------
// Move generation
// ------------------------
function getMovesForPiece(r, c) {
    const piece = board[r][c];
    if (!piece) return [];

    const [color, type] = piece.split("_");

    switch (type) {
        case "pawn": return pawnMoves(r, c, color);
        case "rook": return rookMoves(r, c, color);
        case "bishop": return bishopMoves(r, c, color);
        case "queen": return [...rookMoves(r, c, color), ...bishopMoves(r, c, color)];
        case "king": return kingMoves(r, c, color);
        case "knight": return knightMoves(r, c, color);
    }
    return [];
}

function enemy(color, r, c) {
    return board[r] && board[r][c] && !board[r][c].startsWith(color);
}

function empty(r, c) {
    return board[r] && board[r][c] === "";
}

// ------------------------
// Pawn
// ------------------------
function pawnMoves(r, c, color) {
    let moves = [];
    let dir = color === "w" ? -1 : 1;

    // forward
    if (empty(r+dir, c)) moves.push({r:r+dir, c:c});

    // first double move
    if ((color==="w" && r==6) || (color==="b" && r==1)) {
        if (empty(r+dir, c) && empty(r+2*dir, c))
            moves.push({r:r+2*dir, c:c});
    }

    // captures
    if (enemy(color, r+dir, c+1)) moves.push({r:r+dir, c:c+1});
    if (enemy(color, r+dir, c-1)) moves.push({r:r+dir, c:c-1});

    return moves;
}

// ------------------------
// Rook
// ------------------------
function rookMoves(r, c, color) {
    return slideMoves(r, c, color, [[1,0],[-1,0],[0,1],[0,-1]]);
}

// ------------------------
// Bishop
// ------------------------
function bishopMoves(r, c, color) {
    return slideMoves(r, c, color, [[1,1],[1,-1],[-1,1],[-1,-1]]);
}

// ------------------------
// Sliding pieces helper
// ------------------------
function slideMoves(r, c, color, dirs) {
    let moves = [];
    for (let [dr,dc] of dirs) {
        let rr=r+dr, cc=c+dc;
        while (rr>=0 && rr<8 && cc>=0 && cc<8) {
            if (empty(rr,cc)) {
                moves.push({r:rr,c:cc});
            } else {
                if (enemy(color,rr,cc)) moves.push({r:rr,c:cc});
                break;
            }
            rr+=dr; cc+=dc;
        }
    }
    return moves;
}

// ------------------------
// Knight
// ------------------------
function knightMoves(r, c, color) {
    let moves = [];
    let jump = [
        [2,1],[2,-1],[-2,1],[-2,-1],
        [1,2],[1,-2],[-1,2],[-1,-2]
    ];
    for (let [dr,dc] of jump) {
        let rr=r+dr, cc=c+dc;
        if (rr>=0 && rr<8 && cc>=0 && cc<8) {
            if (empty(rr,cc) || enemy(color,rr,cc))
                moves.push({r:rr,c:cc});
        }
    }
    return moves;
}

// ------------------------
// King
// ------------------------
function kingMoves(r, c, color) {
    let moves = [];
    for (let dr=-1; dr<=1; dr++) {
        for (let dc=-1; dc<=1; dc++) {
            if (dr===0 && dc===0) continue;
            let rr=r+dr, cc=c+dc;
            if (rr>=0 && rr<8 && cc>=0 && cc<8) {
                if (empty(rr,cc) || enemy(color,rr,cc))
                    moves.push({r:rr,c:cc});
            }
        }
    }
    return moves;
}
</script>

</body>
</html>
