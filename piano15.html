<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Piano Playing — 24 Keys</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    background-image: linear-gradient(90deg, #9331d4, rgb(239 5 92 / 70%));
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.intro-container {
    color: #fff;
    text-align: center;
}

.piano-container {
    display: flex;
    align-items: center;
    justify-content: center;
}

.piano-keys-list {
    list-style: none;
    display: flex;
    justify-content: center;
}

/* WHITE KEYS */
.piano-keys {
    width: 5rem;
    cursor: pointer;
    position: relative;
    height: 20rem;
    border-radius: 10px;
    border: 1px solid #000;
    transition: transform 0.06s ease;
}

.white-key {
    background-color: #fff;
}

/* BLACK KEYS */
.black-key {
    width: 2rem;
    height: 13rem;
    position: relative;
    z-index: 2;
    margin: 0 -20px; /* THIS is what makes the black keys sit between white keys */
    background: #000;
    border-radius: 5px;
    border-top-left-radius: 0;
    border-top-right-radius: 0;
}

.piano-keys:active {
    transform: translateY(6px);
}

/* RESPONSIVE */
@media screen and (min-width: 821px) and (max-width: 1024px) {
    .piano-keys { width: 4rem; height: 20rem; }
    .black-key { width: 2rem; height: 13rem; margin: 0 -20px; }
}

@media screen and (min-width: 768px) and (max-width: 820px) {
    .piano-keys { width: 3.5rem; height: 16rem; }
    .black-key { width: 1.8rem; height: 10rem; margin: 0 -20px; }
}

@media screen and (max-width: 576px) {
    .piano-container {
        width: 90%;
        display: flex;
        justify-content: flex-start;
        overflow-x: auto;
    }
    .piano-keys { width: 3.5rem; height: 16rem; }
    .black-key { width: 1.8rem; height: 10rem; margin: 0 -20px; }
}
</style>
</head>

<body>

<div class="intro-container">
    <h1>How to Build a Piano Using HTML, CSS, and JavaScript</h1>
    <h3>This is a 24-key piano. Click any piano key to play the sound.</h3>
</div>

<div class="piano-container">
    <ul class="piano-keys-list">

        <!-- EXACT ORDER YOU PROVIDED -->
        <li class="piano-keys white-key" data-key="01"></li>
        <li class="piano-keys black-key" data-key="02"></li>
        <li class="piano-keys white-key" data-key="03"></li>
        <li class="piano-keys black-key" data-key="04"></li>
        <li class="piano-keys white-key" data-key="05"></li>
        <li class="piano-keys black-key" data-key="06"></li>
        <li class="piano-keys white-key" data-key="07"></li>
        <li class="piano-keys white-key" data-key="08"></li>
        <li class="piano-keys black-key" data-key="09"></li>
        <li class="piano-keys white-key" data-key="10"></li>
        <li class="piano-keys black-key" data-key="11"></li>
        <li class="piano-keys white-key" data-key="12"></li>
        <li class="piano-keys white-key" data-key="13"></li>
        <li class="piano-keys black-key" data-key="14"></li>
        <li class="piano-keys white-key" data-key="15"></li>
        <li class="piano-keys black-key" data-key="16"></li>
        <li class="piano-keys white-key" data-key="17"></li>
        <li class="piano-keys black-key" data-key="18"></li>
        <li class="piano-keys white-key" data-key="19"></li>
        <li class="piano-keys white-key" data-key="20"></li>
        <li class="piano-keys black-key" data-key="21"></li>
        <li class="piano-keys white-key" data-key="22"></li>
        <li class="piano-keys black-key" data-key="23"></li>
        <li class="piano-keys white-key" data-key="24"></li>

    </ul>
</div>

<script>
/* ---------- REAL PIANO FREQUENCIES (C3 → B4) ---------- */
const noteFreq = {
  "01":130.8128, "02":138.5913, "03":146.8324, "04":155.5635,
  "05":164.8138, "06":174.6141, "07":184.9972, "08":196.0000,
  "09":207.6523, "10":220.0000, "11":233.0819, "12":246.9417,
  "13":261.6256, "14":277.1826, "15":293.6648, "16":311.1269,
  "17":329.6276, "18":349.2277, "19":369.9944, "20":392.0000,
  "21":415.3047, "22":440.0000, "23":466.1638, "24":493.8833
};

let audioCtx = null;
function ensureAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') return audioCtx.resume();
    return Promise.resolve();
}

function playNote(freq){
    ensureAudioCtx().then(()=>{
        const ctx = audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1);
    });
}

document.querySelectorAll(".piano-keys").forEach(key=>{
    key.addEventListener("mousedown", ()=>{
        playNote(noteFreq[key.dataset.key]);
        key.classList.add("active");
    });
    window.addEventListener("mouseup", ()=> key.classList.remove("active"));
});

/* Mobile support */
document.addEventListener("pointerdown", ()=>{
    ensureAudioCtx();
},{once:true});
</script>

</body>
</html>
